page = 2
title = "PROJECTS"

[[sections.items]]
heading = "Research on Indoor Millimeter Wave 3D MIMO Channel Model Based on Electromagnetic Characteristics of Building Materials"
date = "Jul 2019 - Jun 2022"
bullets = ["This project studies indoor millimeter-wave 3D MIMO channel modeling based on electromagnetic properties of building materials. By characterizing how walls, ceilings, and floors affect wave propagation, a realistic 3D channel model is developed to support high-precision massive MIMO simulations, beamforming, and millimeter-wave network deployment in complex indoor environments."]

[[sections.items]]
heading = "Research on the interaction between human body and millimeter wave based on different individual characteristics in millimeter wave body domain network"
date = "Jan 2018 - Dec 2020"
bullets = ["This project investigates the interaction between millimeter waves and the human body in body area networks at 28 GHz. A millimeter-wave circularly polarized antenna was designed and reported in our published work. By modeling diverse human morphologies, the study aims to enhance the reliability and adaptability of body-centric communications. The proposed approach supports personalized health monitoring and wearable applications."]

